name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # RATIONALE: Testing across supported Python versions ensures compatibility.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Poetry
      # RATIONALE: pipx is available by default on GitHub runners and isolates Poetry.
      run: pipx install poetry

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # RATIONALE: Automatically handles caching of poetry dependencies to speed up CI.
        cache: 'poetry'

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run Tests
      # RATIONALE: -v shows verbose output, crucial for debugging CI failures.
      run: poetry run pytest -v